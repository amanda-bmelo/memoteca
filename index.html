<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD de Pensamentos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <div class="content-header">
        <div class="logo">
          <img src="assets/images/logo.png" alt="">
          <h1>Trechos de músicas,<br> citações de livros e
            <br> <strong>suas melhores ideias
            <br> num só lugar!</strong>
          </h1>
        </div>
        <div class="image-header">
          <img 
            src="assets/images/computador-cabecalho.png" 
            alt="">
        </div>
      </div>
    </header>
    <main class="background-overlay">
      <div class="overlay"></div>
      <div class="overlay overlay-color"></div>
      <h2>Adicione um pensamento novo:</h2>
      <section id="form-container">
        <form id="thought-form">
          <input type="hidden" id="thought-id" />
          <label for="thought-content">Pensamento</label>
          <textarea 
            id="thought-content" 
            placeholder="Digite seu pensamento" 
            required>
          </textarea>
          <label 
            for="thought-authorship">
              Autoria ou Fonte
            </label>
          <input 
            type="text" 
            id="thought-authorship" 
            placeholder="Insira a autoria ou fonte" 
            required />
          <div class="form-buttons">
            <button 
              type="submit" 
              id="button-save">
              Adicionar
            </button>
            <button 
              type="button" 
              id="button-cancel">
              Cancelar
            </button>
          </div>
        </form>
      </section>
      <span></span>
      <section id="list-thoughts-container">
        <h3>Meu Mural</h3>
        <ul id="list-thoughts"></ul>
      </section>
    </main>
    <footer>
      <p>&copy; 
        2024 Desenvolvido por Alura. 
        Projeto fictício sem fins comerciais.</p>
    </footer>
  </body>
</html>
